name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install repository-pinned toolchain
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          rustup default "$active"
          while read -r toolchain _; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list --quiet)
          rustc --version --verbose
      - name: Restore Rust dependency caches
        id: rust-cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: loom-deps-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          workspaces: |
            . -> target
            tools/quality -> target
      - name: Record cache identity
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Kimi native proposal parsing and no-retry admission
        run: python -B -m unittest discover -s examples/kimi-native/tests -v
      - run: python -m pip install -r examples/log-report/requirements.txt
      - run: python -B -m unittest discover -s examples/log-report/tests -v
      - run: python -m pip install -r examples/log-report/desktop/requirements.txt
      - name: Reject incomplete desktop observation fixtures (no GUI claim)
        run: python -B -m unittest discover -s examples/log-report/desktop/tests -v
      - run: cargo fmt --manifest-path tools/quality/Cargo.toml -- --check
      - run: cargo test --manifest-path tools/quality/Cargo.toml --locked
      - run: cargo clippy --manifest-path tools/quality/Cargo.toml --all-targets --locked -- -D warnings
      - name: Enforce TOML architecture and dependency policy
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo quality --base "$QUALITY_BASE"

  host-handoff:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lazyalexander/an-agent
          ref: 1fafa4cb53930aec777094223d94f253918db4e5
          path: .host-runtime
      - name: Install repository-pinned toolchain
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          rustup default "$active"
          while read -r toolchain _; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list --quiet)
          rustc --version --verbose
      - name: Restore Rust dependency caches
        id: rust-cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: loom-deps-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          workspaces: |
            . -> target
            tools/quality -> target
            .host-runtime -> target
      - run: cargo build --manifest-path .host-runtime/Cargo.toml -p an-agent-host --bin an-agent-host --locked
      - run: mkdir .local
      - run: cargo test --test host_handoff --locked -- --ignored --nocapture
        env:
          AN_AGENT_HOST_BIN: ${{ github.workspace }}/.host-runtime/target/debug/an-agent-host
          LOOM_ACCEPTANCE_DIR: ${{ github.workspace }}/.local/acceptance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/log-report/requirements.txt
      - name: Native editable document custody and cancellation
        run: python examples/log-report/observe.py --host .host-runtime/target/debug/an-agent-host --host-revision 1fafa4cb53930aec777094223d94f253918db4e5 --python "$(command -v python)" --loom target/debug/an-loom --output .local/log-report-acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: portable-log-report-acceptance
          path: |
            .local/log-report-acceptance/acceptance.json
            .local/log-report-acceptance/documents/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: portable-host-acceptance
          path: .local/acceptance/acceptance.json
          if-no-files-found: error

  nextflow-observation:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lazyalexander/an-agent
          ref: fa8cc05e981e743bcc3cfc94fd04efd732827a6b
          path: .host-workspace-runtime
      - name: Install repository-pinned toolchain
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          rustup default "$active"
          while read -r toolchain _; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list --quiet)
          rustc --version --verbose
      - name: Restore Rust dependency caches
        id: rust-cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: loom-deps-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          workspaces: |
            . -> target
            tools/quality -> target
            .host-workspace-runtime -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Nextflow distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/dependencies
          gh release download v26.10.3 --repo nextflow-io/nextflow --pattern nextflow-26.10.3-dist --dir .local/dependencies
          python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('.local/dependencies/nextflow-26.10.3-dist').read_bytes()).hexdigest() == 'e0d46f3274882e73abfb0672cf84b04c6f408b1882d11b51e50dcd533b707da6'"
          chmod 700 .local/dependencies/nextflow-26.10.3-dist
      - run: cargo build --manifest-path .host-workspace-runtime/Cargo.toml -p an-agent-host --bin an-agent-host --locked
      - name: Observe native execution, interruption, resume and custody
        run: |
          python3 examples/nextflow/observe.py --host .host-workspace-runtime/target/debug/an-agent-host --nextflow .local/dependencies/nextflow-26.10.3-dist --java-home "$JAVA_HOME" --output .local/nextflow-acceptance
          python3 examples/nextflow/summarize.py .local/nextflow-acceptance/observation.json fa8cc05e981e743bcc3cfc94fd04efd732827a6b .local/nextflow-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: portable-nextflow-acceptance
          path: .local/nextflow-summary.json
          if-no-files-found: error

  native-spool:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lazyalexander/an-agent
          ref: e3481546e72372c6da6d0f28a187a0504d3a2dc3
          path: .native-host
      - name: Install repository-pinned toolchain
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          rustup default "$active"
          while read -r toolchain _; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list --quiet)
          rustc --version --verbose
      - name: Restore Rust dependency caches
        id: rust-cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          prefix-key: loom-deps-v1
          key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false
          workspaces: |
            . -> target
            tools/quality -> target
            .native-host -> target
      - run: cargo build --manifest-path .native-host/Cargo.toml -p an-agent-host --bin an-agent-host --locked
      - run: mkdir -p .local
      - name: Export, load, edit, execute, cancel, accept and reload a native spool
        run: cargo test --test native_spool --locked -- --ignored --nocapture
        env:
          AN_AGENT_HOST_BIN: ${{ github.workspace }}/.native-host/target/debug/an-agent-host
          LOOM_NATIVE_EVIDENCE: ${{ github.workspace }}/.local/native-spool.json
          LOOM_DEVELOP_NATIVE_EVIDENCE: ${{ github.workspace }}/.local/develop-native.json
          LOOM_CANDIDATE_EVIDENCE: ${{ github.workspace }}/.local/candidate-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-spool-acceptance
          path: |
            .local/native-spool.json
            .local/native-spool.v2.json
            .local/candidate-check.json
            .local/develop-native.json
          if-no-files-found: warn
