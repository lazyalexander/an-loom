[package]
name = "an-loom"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust development workbench for inspectable, reusable domain spools"
repository = "https://github.com/lazyalexander/an-loom"

[[bin]]
name = "an-loom"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace]
resolver = "2"
